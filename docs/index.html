<html lang="en">
<head>

<style>
/* Layout: one full-screen canvas world. Sticker-book chips pinned top and bottom; menus rise as paper cards.
   Single committed look: the world has its own day and night, so the page does not follow the OS theme. */
:root{
  --ink:#1D3124;
  --paper:#F8FBF1;
  --paper-2:#E5EFD6;
  --leaf:#3E9A49;
  --sun:#FFC83A;
  --sun-soft:#FFE9A6;
  --berry:#8B4CC4;
  --warn:#D9573B;
  --moss:#2C5534;
  --scrim:rgba(18,34,24,.5);
  --display:'Grandstander','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Andika','Verdana','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--moss)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--moss);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:3px}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 16px 0;pointer-events:none;flex-wrap:wrap}
.chip,.pill{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.me{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;cursor:pointer;text-align:left}
.me img{width:44px;height:44px;border-radius:11px;background:var(--paper-2);display:block}
.me-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.me .name{font:900 17px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.hunger{display:block;width:104px;height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.hunger i{display:block;height:100%;width:100%;background:var(--leaf);transition:width .25s,background-color .4s}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;min-height:44px;font:900 18px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
button.pill{cursor:pointer}
.pill svg{width:24px;height:24px;flex:none}
.where{font-size:16px}

/* Bottom buttons */
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 16px 14px;pointer-events:none;flex-wrap:wrap}
.btn{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 18px;font:900 18px/1 var(--display);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn svg{width:26px;height:26px;flex:none}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--leaf);color:#fff}
.btn.ghost{background:var(--paper)}
.btn.small{min-height:44px;font-size:16px;padding:6px 14px;box-shadow:0 4px 0 var(--ink)}
.btn[disabled]{background:var(--paper-2);color:#6B7A6E;box-shadow:0 2px 0 var(--ink);cursor:not-allowed}

/* Person prompt + toast */
.prompt{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.prompt p{margin:0;font:900 18px/1.25 var(--display);text-wrap:balance}
.prompt .row{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--sun-soft);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font:900 17px/1.25 var(--display);text-align:center;text-wrap:balance;pointer-events:none;animation:pop .25s ease-out}
@keyframes rise{from{transform:translate(-50%,16px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@keyframes pop{from{transform:translate(-50%,-8px) scale(.96)}to{transform:translate(-50%,0) scale(1)}}

/* Sheets (map, animals, shop) */
.sheet-wrap{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px 16px 20px;animation:sheet .22s ease-out;-webkit-user-select:text;user-select:text}
@keyframes sheet{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet h2{margin:0;font:900 clamp(22px,5vw,30px)/1.05 var(--display);text-wrap:balance}
.x{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;border:3px solid var(--ink);background:var(--paper-2);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.x svg{width:22px;height:22px}
.note{margin:0 0 12px;font-size:15px;line-height:1.45;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 8px 10px;cursor:pointer;box-shadow:0 4px 0 var(--ink);min-width:0}
.card img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;border:2px solid var(--ink);background:var(--paper-2)}
.card .t{font:900 20px/1.1 var(--display)}
.card .d{font-size:14px;line-height:1.35}
.card.here{background:var(--sun-soft)}
.card[disabled]{cursor:not-allowed;box-shadow:0 2px 0 var(--ink)}
.card[disabled] img{filter:grayscale(.7) opacity(.7)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font:700 12px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-2)}
.tag.new{background:var(--sun)}
.tag.lock{background:#F7D9D0}
.list{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border:3px solid var(--ink);border-radius:16px;background:#fff}
.arow.on{background:var(--sun-soft)}
.arow > img{width:76px;height:76px;border-radius:12px;background:var(--paper-2);display:block}
.aname{font:900 19px/1.1 var(--display);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.eats{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.food{display:inline-flex;align-items:center;gap:3px;font-size:13px;line-height:1;padding:2px 8px 2px 2px;border-radius:999px;background:var(--paper-2);white-space:nowrap}
.food img{width:24px;height:24px;display:block}
.food.fav{background:var(--sun);font-weight:700}
.need{display:block;font-size:13px;margin-top:6px;color:#5A665C}
.playing{font:900 15px/1 var(--display);padding:8px 12px;border-radius:12px;border:2px dashed var(--ink)}
.price{display:inline-flex;align-items:center;gap:4px}
.price svg{width:20px;height:20px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;min-height:46px;border:3px solid var(--ink);border-radius:14px;background:var(--paper-2);font:900 17px/1 var(--display);cursor:pointer}
.tab[aria-selected="true"]{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pack{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.pack-leaves{display:inline-flex;align-items:center;gap:6px;font:900 26px/1 var(--display);font-variant-numeric:tabular-nums}
.pack-leaves svg{width:30px;height:30px}
.pack-price{font:700 16px/1 var(--body);padding:6px 12px;border-radius:999px;background:var(--paper-2)}
.gc{display:flex;flex-direction:column;gap:10px;max-width:420px}
.gc h3{margin:0;font:900 22px/1.1 var(--display)}
.gc p{margin:0;line-height:1.45}
.gcq{font:900 24px/1.2 var(--display)}
.gcform{display:flex;flex-direction:column;gap:10px}
.gcform input{font:900 26px/1 var(--display);width:140px;padding:8px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.gcform .row{display:flex;gap:10px;flex-wrap:wrap}
.gcmsg{min-height:1.4em;color:var(--warn);font-weight:700}
.cloudform{width:100%;max-width:340px;text-align:left}
.cloudform label{font:900 16px/1 var(--display)}
.cloudform input{width:100%;font:700 18px/1.2 var(--body);padding:10px 12px}
.cloudform .row{justify-content:flex-start}
.cloud-line{font-size:15px}

/* Title */
.title-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 45%,rgba(18,34,24,.05),rgba(18,34,24,.5));overflow:auto}
.title-card{width:min(660px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.title-card h1{margin:0;font:900 clamp(46px,12vw,96px)/.9 var(--display);color:var(--sun);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);letter-spacing:.01em;text-wrap:balance}
.byline{margin:0;font:700 18px/1.2 var(--body);color:var(--paper);text-shadow:0 2px 0 var(--ink),0 0 8px var(--ink)}
.title-body{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto}
.title-body h2{margin:0;font:900 24px/1.1 var(--display);text-wrap:balance}
.title-body p{margin:0;line-height:1.45;max-width:46ch}
.title-body .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.linkish{background:none;border:0;padding:8px;font:700 15px var(--body);text-decoration:underline;cursor:pointer;color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.pcard{width:112px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:6px 4px 10px;font:900 16px/1.1 var(--display);cursor:pointer}
.pcard img{width:88px;height:88px;display:block}
.pcard:active,.card:active:not([disabled]),.pack:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

@media (max-width:520px){
  .arow{grid-template-columns:64px minmax(0,1fr)}
  .arow > img{width:64px;height:64px}
  .arow > .btn,.arow > .playing{grid-column:1 / -1;justify-self:stretch;text-align:center}
  .btn{font-size:16px;padding:8px 14px}
  .bar{flex-wrap:nowrap;gap:8px}
  .bar .btn{padding:8px 11px;gap:6px;min-height:50px}
  .btn svg{width:22px;height:22px}
  .hud{gap:6px}
  .stats{gap:6px}
  .pill{font-size:16px;padding:5px 8px;min-height:40px;gap:5px}
  .pill svg{width:21px;height:21px}
  .me{padding:4px 10px 4px 4px;gap:6px}
  .me img{width:38px;height:38px}
  .me .name{font-size:15px;max-width:88px}
  .hunger{width:76px}
  .where,.clock-word{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>


<div id="app">
  <canvas id="world" aria-label="Game world. Tap or drag to walk."></canvas>

  <div class="hud" id="hud" hidden>
    <button class="chip me" type="button" data-action="animals" aria-label="My animals">
      <img id="meImg" alt="" width="44" height="44">
      <span class="me-text"><span class="name" id="meName">Duck</span><span class="hunger" title="Food"><i id="hungerFill"></i></span></span>
    </button>
    <div class="stats">
      <span class="pill where" id="wherePill">Land</span>
      <button class="pill" type="button" data-action="shop" data-v="leaves" aria-label="Leaves"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 10 10 4 20 4C20 14 14 20 4 20Z" fill="#5DBB4E" stroke="#1D3124" stroke-width="2" stroke-linejoin="round"/><path d="M4 20L16 8M9 15V11M12 12V8.5M9 15H13M12 12H15.5" stroke="#1D3124" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg><span id="leafCount">0</span></button>
      <span class="pill" id="clockPill">
        <span id="sunIco"><svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#1D3124" stroke-width="2" stroke-linecap="round"><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1"/></g><circle cx="12" cy="12" r="5.2" fill="#FFC83A" stroke="#1D3124" stroke-width="2"/></svg></span>
        <span id="moonIco" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.2A8.8 8.8 0 1 0 20.8 15 7 7 0 0 1 15.5 3.2Z" fill="#F4EBC0" stroke="#1D3124" stroke-width="2" stroke-linejoin="round"/></svg></span>
        <span class="clock-word" id="clockWord">Day</span><span id="clockText">12:00</span>
      </span>
    </div>
  </div>

  <div class="bar" id="bar" hidden>
    <button class="btn" type="button" data-action="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2.2 6 2.2 6-2.2v14.2l-6 2.2-6-2.2-6 2.2Z" fill="#FFFFFF" stroke="#1D3124" stroke-width="2" stroke-linejoin="round"/><path d="M9 3.8v14.2M15 6v14.2" stroke="#1D3124" stroke-width="2"/></svg>Map</button>
    <button class="btn" type="button" data-action="animals"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#FFFFFF" stroke="#1D3124" stroke-width="1.8"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="5.5" cy="10.5" r="2.3"/><circle cx="9.3" cy="6.3" r="2.3"/><circle cx="14.7" cy="6.3" r="2.3"/><circle cx="18.5" cy="10.5" r="2.3"/></g></svg>Animals</button>
    <button class="btn" type="button" data-action="shop" data-v="animals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.5H6.2Z" fill="#FFFFFF" stroke="#1D3124" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="#1D3124" stroke-width="2" stroke-linecap="round"/></svg>Shop</button>
  </div>

  <div class="prompt" id="prompt" hidden role="dialog" aria-live="polite">
    <p id="promptText"></p>
    <div class="row"><button class="btn green" type="button" data-action="yes">Yes!</button><button class="btn ghost" type="button" data-action="no">Not now</button></div>
  </div>

  <div class="toast" id="toast" hidden role="status"></div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" type="button" data-action="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="#1D3124" stroke-width="3.2" stroke-linecap="round"/></svg></button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="title-wrap" id="titleWrap">
    <div class="title-card">
      <h1>Animal<br>Adventures</h1>
      <p class="byline">A game by Rosemary</p>
      <div class="title-body" id="titleBody"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const TAU = Math.PI * 2;
const DAY_LEN = 12 * 60, NIGHT_LEN = 10 * 60, CYCLE = DAY_LEN + NIGHT_LEN, FADE = 40;
const WORLD_W = 2400, WORLD_H = 1700;
const INK = '#1D3124';
const SAVE_KEY = 'animal-adventures-v1';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

const FOODS = {
  apple:    { name: 'Apples' },
  worm:     { name: 'Worms' },
  smallfish:{ name: 'Small fish', water: true },
  fish:     { name: 'Fish', water: true },
  grass:    { name: 'Grass' },
  berries:  { name: 'Berries' },
  carrot:   { name: 'Carrots' },
  pinecone: { name: 'Pine cones' },
  acorn:    { name: 'Acorns' },
};

// box = [left x, right x, height] of the drawing, used to size icons
const ANIMALS = {
  duck:     { name: 'Duck', many: 'Ducks', eats: ['worm','smallfish','grass','berries'], fav: 'smallfish', fly: true, swim: true, speed: 150, box: [-29, 31, 40] },
  swan:     { name: 'Swan', many: 'Swans', eats: ['grass','smallfish','berries'], fav: 'grass', fly: true, swim: true, speed: 145, box: [-30, 32, 54] },
  chicken:  { name: 'Chicken', many: 'Chickens', eats: ['worm','berries','acorn','grass','carrot'], fav: 'worm', speed: 140, box: [-26, 26, 44] },
  frog:     { name: 'Tree frog', many: 'Tree frogs', eats: ['worm','smallfish'], fav: 'worm', swim: true, hop: true, speed: 150, box: [-21, 21, 26] },
  lizard:   { name: 'Lizard', many: 'Lizards', eats: ['worm','berries','apple'], fav: 'worm', speed: 170, box: [-44, 27, 18] },
  snake:    { name: 'Garter snake', many: 'Garter snakes', eats: ['worm','smallfish','fish'], fav: 'fish', swim: true, speed: 150, box: [-38, 31, 16] },

  squirrel: { name: 'Squirrel', many: 'Squirrels', eats: ['acorn','pinecone','berries','apple'], fav: 'acorn', speed: 175, price: 40, box: [-24, 19, 44] },

  fox:      { name: 'Fox', many: 'Foxes', eats: ['worm','berries','apple','smallfish'], fav: 'berries', speed: 180, price: 90, box: [-37, 33, 38] },
  owl:      { name: 'Owl', many: 'Owls', eats: ['worm','smallfish'], fav: 'worm', fly: true, nightEyes: true, speed: 160, price: 120, box: [-17, 17, 44] },
  deer:     { name: 'Deer', many: 'Deer', eats: ['grass','acorn','apple','carrot'], fav: 'apple', speed: 190, price: 150, box: [-21, 33, 64] },
  parrot:   { name: 'Parrot', many: 'Parrots', eats: ['berries','apple','acorn'], fav: 'berries', fly: true, speed: 165, price: 200, box: [-20, 22, 42] },
  moose:    { name: 'Moose', many: 'Moose', eats: ['grass','apple','carrot'], fav: 'grass', swim: true, speed: 150, price: 300, box: [-27, 45, 64] },
};
const STARTERS = ['duck','swan','chicken','frog','lizard','snake','bunny'];
const SHOP = ['squirrel','turtle','fox','owl','deer','parrot','moose'];

const WORLD_ORDER = ['land','sky','forest','swamp','jungle','meadow'];
const WORLDS = {

  x.translate(N / 2 - ((x0 + x1) / 2) * s, N / 2 + (h / 2) * s); x.scale(s, s); sty(x); DRAW[id](x, 0, 0, 0);
  return (ICON[id] = c.toDataURL());
}
function foodIcon(t) {
  if (FICON[t]) return FICON[t];
  const c = document.createElement('canvas'); c.width = c.height = 48; const x = c.getContext('2d');
  x.translate(24, t === 'grass' ? 30 : 25); x.scale(1.75, 1.75); sty(x); FOOD_DRAW[t](x, 0);
  return (FICON[t] = c.toDataURL());
}
function worldPreview(id) {
  if (PREV[id]) return PREV[id];
  const c = document.createElement('canvas'); c.width = 352; c.height = 198; const x = c.getContext('2d');
  const sc = 0.34, vw = c.width / sc, vh = c.height / sc, cx = WORLD_W / 2 + 60 - vw / 2, cy = WORLD_H / 2 - 30 - vh / 2;
  x.setTransform(sc, 0, 0, sc, -cx * sc, -cy * sc);
  drawScene(x, getGen(id), { x0: cx, y0: cy, x1: cx + vw, y1: cy + vh }, 0, null);
  return (PREV[id] = c.toDataURL('image/png'));
}

/* ---------- HUD + UI ---------- */
function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return `${(sec / 60) | 0}:${String(sec % 60).padStart(2, '0')}`; }
function hud() {
  const h = R.hud, di = dayInfo(), A = ANIMALS[S.animal];
  if (h.leaves !== S.leaves) { h.leaves = S.leaves; $('leafCount').textContent = S.leaves; }
  const hv = Math.round(S.hunger);
  if (h.hunger !== hv) { h.hunger = hv; const f = $('hungerFill'); f.style.width = hv + '%'; f.style.backgroundColor = hv > 50 ? '#3E9A49' : hv > 20 ? '#F2B124' : '#D9573B'; }
  if (h.animal !== S.animal) { h.animal = S.animal; $('meImg').src = animalIcon(S.animal); $('meName').textContent = A.name; }
  if (h.world !== S.world) { h.world = S.world; $('wherePill').textContent = WORLDS[S.world].name; }
  const ct = fmt(di.left);
  if (h.clock !== ct || h.night !== di.night) { h.clock = ct; h.night = di.night; $('clockText').textContent = ct; $('clockWord').textContent = di.night ? 'Night' : 'Day'; $('sunIco').hidden = di.night; $('moonIco').hidden = !di.night; $('clockPill').setAttribute('aria-label', (di.night ? 'Night, ' : 'Day, ') + fmt(di.left) + (di.night ? ' until morning' : ' until night')); }
}
let toastTimer = 0;
function toast(msg, ms = 2800) { const t = $('toast'); t.textContent = msg; t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms); }

function tags(id) {
  const A = ANIMALS[id], out = [];
  if (A.fly) out.push('<span class="tag">Flies</span>');
  if (A.swim) out.push('<span class="tag">Swims</span>');
  if (A.nightEyes) out.push('<span class="tag">Sees at night</span>');
  return out.join('');
}
function foodChips(id) { const A = ANIMALS[id]; return `<span class="eats">${A.eats.map(f => `<span class="food${f === A.fav ? ' fav' : ''}"><img src="${foodIcon(f)}" alt="">${FOODS[f].name}</span>`).join('')}</span>`; }
function openSheet(kind) { R.sheet = kind; hidePrompt(); R.keys = {}; R.holding = false; renderSheet(); $('sheetWrap').hidden = false; R.paused = true; }
function closeSheet() { R.sheet = null; $('sheetWrap').hidden = true; if (!R.attract) R.paused = false; save(); }
function renderSheet() {
  const t = $('sheetTitle'), b = $('sheetBody');
  if (R.sheet === 'map') { t.textContent = 'Where do you want to go?'; b.innerHTML = sheetMap(); }
  else if (R.sheet === 'animals') { t.textContent = 'My animals'; b.innerHTML = sheetAnimals(); }
  else if (R.sheet === 'shop') {
    t.textContent = R.shopTab === 'grownup' ? 'Leaf store' : 'Shop'; b.innerHTML = sheetShop();
    if (R.shopTab === 'grownup') setTimeout(() => { const i = $('gcInput'); if (i) i.focus(); }, 60);
  }
}
function sheetMap() {
  const A = ANIMALS[S.animal];
  return `<div class="grid">${WORLD_ORDER.map(id => {
    const w = WORLDS[id], here = id === S.world, locked = w.needsFly && !A.fly, isNew = !S.visited.includes(id);
    return `<button class="card${here ? ' here' : ''}" type="button" data-action="go" data-v="${id}"${locked ? ' disabled' : ''}>
      <img src="${worldPreview(id)}" alt="">
      <span class="t">${w.name}</span><span class="d">${w.blurb}</span>
      <span class="tags">${here ? '<span class="tag">You are here</span>' : ''}${locked ? `<span class="tag lock">${A.many} can't fly</span>` : ''}${!here && !locked && isNew ? '<span class="tag new">New! +10 leaves</span>' : ''}</span>
    </button>`;
  }).join('')}</div>`;
}
function sheetAnimals() {
  const ids = STARTERS.concat(SHOP).filter(i => S.owned.includes(i));
  return `<p class="note">Tap Play to switch animals. Yellow foods are favorites and give 2 leaves each.</p><div class="list">${ids.map(id => {
    const A = ANIMALS[id], on = id === S.animal;
    return `<div class="arow${on ? ' on' : ''}"><img src="${animalIcon(id)}" alt=""><div><div class="aname">${A.name} ${tags(id)}</div>${foodChips(id)}</div>${on ? '<span class="playing">Playing</span>' : `<button class="btn small" type="button" data-action="switch" data-v="${id}">Play</button>`}</div>`;
  }).join('')}</div>`;
}
function sheetShop() {
  if (R.shopTab === 'grownup') return gcView();
  const tabs = `<div class="tabs" role="tablist"><button class="tab" role="tab" type="button" aria-selected="${R.shopTab === 'animals'}" data-action="tab" data-v="animals">Animals</button><button class="tab" role="tab" type="button" aria-selected="${R.shopTab === 'leaves'}" data-action="tab" data-v="leaves">Leaves</button></div>`;
  if (R.shopTab === 'leaves') return tabs + `<p class="note">Playing earns leaves for free. A leaf pack gets you a lot more at once. This is a pretend store, so no real money gets spent.</p><div class="packs">${PACKS.map(p => `<button class="pack" type="button" data-action="pack" data-v="${p.id}"><span class="pack-leaves">${LEAF_SVG}${p.leaves}</span><span class="pack-price">${p.price}</span></button>`).join('')}</div>`;
  const items = SHOP.filter(id => !S.owned.includes(id));
  if (!items.length) return tabs + '<p class="note">You have every animal in the shop!</p>';
  return tabs + `<p class="note">You have <b>${S.leaves}</b> leaves. Eat food to earn more.</p><div class="list">${items.map(id => {
    const A = ANIMALS[id], need = A.price - S.leaves;
    return `<div class="arow"><img src="${animalIcon(id)}" alt=""><div><div class="aname">${A.name} ${tags(id)}</div>${foodChips(id)}${need > 0 ? `<span class="need">${need} more leaves to go</span>` : ''}</div><button class="btn small" type="button" data-action="buy" data-v="${id}"${need > 0 ? ' disabled' : ''}><span class="price">${LEAF_SVG}${A.price}</span></button></div>`;
  }).join('')}</div>`;
}
function gcView() {
  const p = PACKS.find(x => x.id === R.pack) || PACKS[0];
  return `<div class="gc"><h3>Grown-up check</h3><p>Ask a grown-up to answer this to get ${p.leaves} leaves for ${p.price} (pretend).</p>
    <form id="gcForm" class="gcform" autocomplete="off"><label class="gcq" for="gcInput">What is ${R.gc[0]} × ${R.gc[1]}?</label>
    <input id="gcInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-describedby="gcMsg">
    <div class="row"><button class="btn green" type="submit">Check</button><button class="btn ghost" type="button" data-action="tab" data-v="leaves">Back</button></div>
    <p class="gcmsg" id="gcMsg" role="status"></p></form></div>`;
}
function travel(id) {
  if (!WORLDS[id]) return;
  const A = ANIMALS[S.animal];
  if (WORLDS[id].needsFly && !A.fly) return;
  if (id === S.world) { closeSheet(); return; }
  enterWorld(id, false);
  if (!S.visited.includes(id)) { S.visited.push(id); S.leaves += 10; toast(`You found the ${WORLDS[id].name}! +10 leaves`); }
  else toast(`Welcome to the ${WORLDS[id].name}`);
  closeSheet();
}
function switchAnimal(id) {
  if (!S.owned.includes(id)) return;
  S.animal = id; R.hud.animal = null;
  const A = ANIMALS[id];
  if (WORLDS[S.world].needsFly && !A.fly) { enterWorld('land', false); toast(`${A.many} can't fly, so you went back to Land.`); }
  else fixPosition();
  closeSheet();
}
function buyAnimal(id) {
  const A = ANIMALS[id]; if (!A || S.owned.includes(id) || S.leaves < A.price) return;
  S.leaves -= A.price; S.owned.push(id); S.animal = id; R.hud.animal = null;
  if (WORLDS[S.world].needsFly && !A.fly) enterWorld('land', false); else fixPosition();
  closeSheet(); toast(`You got a ${A.name.toLowerCase()}!`);
  for (let i = 0; i < 5; i++) R.particles.push({ kind: 'heart', x: S.x + (Math.random() - 0.5) * 40, y: S.y - 40, vy: -40 - Math.random() * 20, life: 1.2 });
}
function newGc() { return [6 + ((Math.random() * 7) | 0), 6 + ((Math.random() * 7) | 0)]; }
function checkGc() {
  const i = $('gcInput'), p = PACKS.find(x => x.id === R.pack); if (!i || !p) return;
  if (parseInt(i.value, 10) === R.gc[0] * R.gc[1]) { S.leaves += p.leaves; R.shopTab = 'leaves'; renderSheet(); toast(`+${p.leaves} leaves! Pretend purchase, no real money.`); save(); }
  else { $('gcMsg').textContent = 'Not quite. Ask a grown-up to try again.'; i.value = ''; i.focus(); }
}

/* ---------- cloud saves (only in the GitHub Pages build, where AA_API is set) ---------- */
const API = String(window.AA_API || '').replace(/\/$/, '');
const TOKEN_KEY = 'animal-adventures-token', USER_KEY = 'animal-adventures-user';
const cloud = { token: null, user: null, pushT: 20, dirty: false };
try { cloud.token = localStorage.getItem(TOKEN_KEY); cloud.user = localStorage.getItem(USER_KEY); } catch (e) {}
async function api(method, path, data) {
  const headers = { 'Content-Type': 'application/json' };
  if (cloud.token) headers.Authorization = 'Bearer ' + cloud.token;
  let res;
  try { res = await fetch(API + path, { method, headers, body: data ? JSON.stringify(data) : undefined, keepalive: method === 'PUT' }); }
  catch (e) { const err = new Error("Couldn't reach the internet. Try again in a minute."); err.status = 0; throw err; }
  let j = {}; try { j = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(j.error || 'Something went wrong. Try again.'); err.status = res.status; throw err; }
  return j;
}
function setSession(token, name) {
  cloud.token = token; cloud.user = name;
  try { if (token) { localStorage.setItem(TOKEN_KEY, token); localStorage.setItem(USER_KEY, name); } else { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); } } catch (e) {}
}
// Newest save wins. Returns true when the cloud copy replaced this device's game.
async function pullCloud() {
  const r = await api('GET', '/api/save'), c = r.save;
  if (c && c.v === 1 && c.started && (!S.started || (c.saved || 0) > (S.saved || 0))) {
    applySave(c); enterWorld(S.world, true); R.hud = {};
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
    return true;
  }
  if (S.started) await pushCloud();
  return false;
}
async function pushCloud() {
  if (!API || !cloud.token || !S.started) return;
  try { await api('PUT', '/api/save', { save: S }); }
  catch (e) { if (e.status === 401) setSession(null, null); else cloud.dirty = true; }
}
async function cloudSubmit(mode) {
  const msg = $('cloudMsg'), name = $('cName').value.trim(), pass = $('cPass').value;
  if (!/^[A-Za-z0-9_-]{3,20}$/.test(name)) { msg.textContent = 'Names are 3 to 20 letters or numbers.'; return; }
  if (pass.length < 6) { msg.textContent = 'Passwords need at least 6 characters.'; return; }
  msg.textContent = mode === 'register' ? 'Making your account...' : 'Signing in...';
  for (const b of document.querySelectorAll('#cloudForm button')) b.disabled = true;
  try {
    const r = await api('POST', mode === 'register' ? '/api/register' : '/api/login', { username: name, password: pass });
    setSession(r.token, r.user.name);
    const applied = await pullCloud();
    renderTitle();
    toast(applied ? `Welcome back, ${r.user.name}! Your game is loaded.` : `Saving online as ${r.user.name}.`);
  } catch (e) {
    msg.textContent = e.message;
    for (const b of document.querySelectorAll('#cloudForm button')) b.disabled = false;
  }
}
async function signOut() {
  try { await api('POST', '/api/logout'); } catch (e) {}
  setSession(null, null); renderTitle();
}

/* ---------- title ---------- */
function renderTitle(mode) {
  const b = $('titleBody');
  if (mode === 'pick') {
    b.innerHTML = `<h2>Pick an animal to start</h2><p>You can switch any time. More animals are in the shop.</p><div class="pick">${STARTERS.map(id => `<button class="pcard" type="button" data-action="pick" data-v="${id}"><img src="${animalIcon(id)}" alt="">${ANIMALS[id].name}</button>`).join('')}</div>`;
  } else if (mode === 'reset') {
    b.innerHTML = `<h2>Start over?</h2><p>Your leaves and animals will go away.</p><div class="row"><button class="btn" type="button" data-action="reset-yes">Yes, start over</button><button class="btn ghost" type="button" data-action="reset-no">No, keep playing</button></div>`;
  } else if (S.started) {
    b.innerHTML = `<p>Eat food, earn leaves, and explore six worlds.</p><div class="row"><button class="btn green" type="button" data-action="play">Keep playing</button></div>${cloudBlock()}<button class="linkish" type="button" data-action="reset">Start over</button>`;
  } else if (mode === 'cloud') {
    b.innerHTML = `<h2>Save online</h2><p>Make an account to keep your animals and leaves on any phone, tablet or computer. A grown-up can help.</p>
      <form id="cloudForm" class="gcform cloudform">
        <label for="cName">Name</label><input id="cName" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20">
        <label for="cPass">Password</label><input id="cPass" type="password" autocomplete="current-password" maxlength="128">
        <div class="row"><button class="btn green" type="submit" data-mode="login">Sign in</button><button class="btn" type="submit" data-mode="register">Make account</button></div>
        <p class="gcmsg" id="cloudMsg" role="status"></p>
      </form><button class="linkish" type="button" data-action="reset-no">Back</button>`;
  } else {
    b.innerHTML = `<p>Eat food, earn leaves, and explore six worlds.</p><div class="row"><button class="btn green" type="button" data-action="new">Play</button></div>${cloudBlock()}`;
  }
}
function cloudBlock() {
  if (!API) return '';
  if (cloud.user) return `<p class="cloud-line">Saving online as <b>${esc(cloud.user)}</b>. <button class="linkish" type="button" data-action="signout">Sign out</button></p>`;
  return '<button class="linkish" type="button" data-action="cloud">Save online to play on other devices</button>';
}
function esc(t) { return String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]); }
function play() {
  $('titleWrap').hidden = true; $('hud').hidden = false; $('bar').hidden = false;
  R.attract = false; R.paused = false; R.wasNight = dayInfo().night; R.hud = {}; hud();
}
function pickStarter(id) {
  S.started = true; S.owned = Array.from(new Set(STARTERS.concat(S.owned))); S.animal = id;
  S.visited = ['land']; S.time = 0; S.hunger = 100;
  enterWorld('land', false); play(); save();
  toast('Tap or drag to walk. Eat glowing food to earn leaves!', 4500);
}
function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  Object.assign(S, fresh()); enterWorld('meadow', false); renderTitle('pick');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
  const v = b.dataset.v;
  switch (b.dataset.action) {
    case 'new': renderTitle('pick'); break;
    case 'play': play(); break;
    case 'pick': pickStarter(v); break;
    case 'reset': renderTitle('reset'); break;
    case 'reset-yes': resetGame(); break;
    case 'reset-no': renderTitle(); break;
    case 'map': openSheet('map'); break;
    case 'animals': openSheet('animals'); break;
    case 'shop': R.shopTab = v || 'animals'; openSheet('shop'); break;
    case 'tab': R.shopTab = v; renderSheet(); break;
    case 'pack': R.pack = v; R.gc = newGc(); R.shopTab = 'grownup'; renderSheet(); break;
    case 'go': travel(v); break;
    case 'switch': switchAnimal(v); break;
    case 'buy': buyAnimal(v); break;
    case 'close': closeSheet(); break;
    case 'yes': acceptPerson(); break;
    case 'no': declinePerson(); break;
    case 'cloud': renderTitle('cloud'); setTimeout(() => { const i = $('cName'); if (i) i.focus(); }, 50); break;
    case 'signout': signOut(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'gcForm') { e.preventDefault(); checkGc(); }
  if (e.target.id === 'cloudForm') { e.preventDefault(); cloudSubmit((e.submitter && e.submitter.dataset.mode) || 'login'); }
});
$('sheetWrap').addEventListener('click', e => { if (e.target === $('sheetWrap')) closeSheet(); });

/* ---------- loop ---------- */
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; G += dt;
  if (!R.paused && !R.attract) update(dt);
  else if (R.attract) { for (const p of R.people) updatePerson(p, dt); }
  render();
  if (!R.attract) hud();
  requestAnimationFrame(frame);
}
function start(data) {
  const snap = data && data.S;
  applySave(snap || load());
  resize();
  enterWorld(S.started ? S.world : 'meadow', !!S.started);
  renderTitle();
  if (snap && data.playing && S.started) play();
  if (API && cloud.token && !(snap && data.playing)) pullCloud().then(applied => { if (R.attract) renderTitle(); }).catch(err => { if (err.status === 401) { setSession(null, null); if (R.attract) renderTitle(); } });
  window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), playing: !R.attract }));
  if (location.hash === '#test') window.__aa = { S, R, enterWorld, dayInfo, ANIMALS, save, pushCloud };
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
