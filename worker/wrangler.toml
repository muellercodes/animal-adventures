name = "animal-adventures-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://muellercodes.github.io"

[[d1_databases]]
binding = "DB"
database_name = "animal-adventures"
database_id = "1939f3d1-ce39-4db2-a489-67af9021098c"

# live multiplayer: one Durable Object per world (SQLite-backed, which works on the free plan)
[[durable_objects.bindings]]
name = "WORLDS"
class_name = "WorldRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldRoom"]

[triggers]
crons = ["23 4 * * *"]
