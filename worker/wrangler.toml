name = "animal-adventures-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://muellercodes.github.io"

[[d1_databases]]
binding = "DB"
database_name = "animal-adventures"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["23 4 * * *"]
